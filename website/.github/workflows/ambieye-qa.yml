name: AmbiEye Automated Master QA Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  qa-pipeline:
    name: AmbiEye Execution-Based QA Framework
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://127.0.0.1:3000
      HEADLESS: "true"
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Project Dependencies
        working-directory: website
        run: npm install

      - name: Build Next.js Application
        working-directory: website
        run: npm run build

      - name: Start Next.js Application Server
        working-directory: website
        run: |
          npm run start &
          npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Discover Codebase & Validate Exact Test Counts (300 E2E + 300 API)
        working-directory: website
        run: |
          npm run discover
          npm run test:count

      - name: Execute 300 Selenium E2E Tests
        if: always()
        working-directory: website
        run: npm run test:e2e

      - name: Execute 300 API Integration Tests
        if: always()
        working-directory: website
        run: npm run test:api

      - name: Execute Load & Performance Testing
        if: always()
        working-directory: website
        run: npm run test:load

      - name: Execute Safe Defensive Security Validation
        if: always()
        working-directory: website
        run: npm run test:security

      - name: Generate Master Excel Report & GitHub Job Summary Dashboard
        if: always()
        working-directory: website
        run: npm run test:all

      - name: Upload Master Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmbiEye_Test_Execution_Report
          path: website/reports/AmbiEye_Test_Execution_Report.xlsx

      - name: Upload Test Screenshots & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmbiEye_Test_Logs_And_Screenshots
          path: |
            website/reports/screenshots/
            website/reports/execution-log.json
